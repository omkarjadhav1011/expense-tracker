spring:
  application:
    name: expensetracker-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expensetracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    jwt:
      # Read by JwtTokenProvider. HS256 needs at least 32 bytes, so any override
      # must be that long or the app fails fast with a WeakKeyException.
      secret: ${JWT_SECRET:expensetracker_super_secret_key_256_bits!}
      expiration: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

server:
  port: 8080

logging:
    level:
      org.springframework.security: DEBUG
