spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expensetracker_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.omkar.expensetracker: DEBUG